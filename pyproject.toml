[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-spider"
version = "0.1.0"
description = "Crawl a website and map what is really there, then cross-check it against the site's own sitemap.xml"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Amithi Liyanagamage" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.3"]
js = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/amithia/site-spider"

[project.scripts]
# Hyphenated is the documented name; the unhyphenated alias is kept
# because it is what people type, and both are ours on PyPI.
"site-spider" = "sitespider.cli:main"
sitespider = "sitespider.cli:main"

[tool.setuptools.packages.find]
include = ["sitespider*"]

[tool.setuptools.package-data]
sitespider = ["templates/*.html"]

[tool.ruff]
target-version = "py310"
